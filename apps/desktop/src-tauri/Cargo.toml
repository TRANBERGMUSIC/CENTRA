[package]
name = "centra"
version = "0.2.0"
description = "CENTRA — your life, in focus"
edition = "2021"

[lib]
name = "centra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mail and calendars (see src/mail.rs)
imap = { version = "2.4", default-features = false }
native-tls = "0.2"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "native-tls", "hostname"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Fast interface updates (see src/webupdate.rs): signed tar.gz, same minisign key as the app updates
minisign-verify = "0.3"
base64 = "0.23"
flate2 = "1"
tar = "0.4"

# Touch ID unlock (see src/biometry): LocalAuthentication for the finger, the login keychain for the key
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSData"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "LABiometryType", "block2"] }
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
