[package]
name = "centra"
version = "0.2.0"
description = "CENTRA — your life, in focus"
edition = "2021"

[lib]
name = "centra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Reminders (huskelisten): planned on the iPhone, shown by the app on the Mac
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mail and calendars (see src/mail.rs)
imap = { version = "2.4", default-features = false }
native-tls = "0.2"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "native-tls", "hostname"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Fast interface updates (see src/webupdate.rs): signed tar.gz, same minisign key as the app updates
minisign-verify = "0.3"
base64 = "0.23"
flate2 = "1"
tar = "0.4"

# Mac and Windows only: the in-app browser, app updates, one running copy.
# (The iPhone app is built from the same code without these; see docs/IPHONE.md.)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Several webviews in one window (the browser's toolbar + page) and a proxy per webview (the VPN)
tauri = { version = "2", features = ["unstable", "macos-proxy"] }
# The browser's VPN relay (see src/browser/relay.rs)
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
# WireGuard for the browser (see src/browser/wg.rs): the protocol, and a TCP/IP stack inside the tunnel
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.12", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-dns", "socket-tcp", "socket-udp", "socket-dns"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

# Touch ID (Mac) and Face ID (iPhone) unlock (see src/biometry): LocalAuthentication for the
# finger or face, the keychain for the key
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSData", "NSArray", "NSCalendar", "NSObjCRuntime", "NSUserDefaults"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "LABiometryType", "block2"] }
security-framework = "3"

# Contacts import on the Mac (see src/contacts)
[target.'cfg(target_os = "macos")'.dependencies]
objc2-contacts = { version = "0.3", default-features = false, features = ["std", "block2", "CNContactStore", "CNContact", "CNContactFetchRequest", "CNFetchRequest", "CNLabeledValue", "CNPhoneNumber", "CNPostalAddress", "CNSocialProfile"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# A mistake in one command (an unexpected empty value from macOS, say) becomes an error message
# instead of closing the whole app.
panic = "unwind"
strip = true
