name: CI
on:
  push:
    branches: [main]
  pull_request:
# Tests only: read the code, nothing else.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @centra/design-system
      - run: npx vitest run
      - run: npx tsc -p apps/app/tsconfig.json --noEmit
      - run: npm run build -w @centra/app
