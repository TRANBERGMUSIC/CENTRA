name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @centra/design-system
      - run: npx vitest run
      - run: npx tsc -p apps/app/tsconfig.json --noEmit
      - run: npm run build -w @centra/app
