# The sync server (Cloudflare Worker + Durable Object) on its own: a change to it is live in about
# 30 seconds, without building the apps. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
name: Sync server
on:
  push:
    branches: [main]
    paths: ['services/relay-cf/**', 'packages/relay-core/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: relay, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run packages/relay-core
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Ingen CLOUDFLARE_API_TOKEN: springer over."; exit 0; fi
          cd services/relay-cf && npx --yes wrangler@4 deploy
      # Push to the iPhone through Apple (docs/IPHONE.md, "Push"): the APNs key goes to the relay as
      # secrets on every deploy (Cloudflare keeps them encrypted; nothing is printed).
      - name: Push key
        env:
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$APNS_KEY_P8" ] || [ -z "$APNS_KEY_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then echo "Ingen APNs-nøgle endnu: push er slået fra."; exit 0; fi
          cd services/relay-cf
          printf '%s' "$APNS_KEY_P8" | npx --yes wrangler@4 secret put APNS_KEY >/dev/null
          printf '%s' "$APNS_KEY_ID" | npx --yes wrangler@4 secret put APNS_KEY_ID >/dev/null
          printf '%s' "$APPLE_TEAM_ID" | npx --yes wrangler@4 secret put APNS_TEAM_ID >/dev/null
          echo "Push er slået til."
