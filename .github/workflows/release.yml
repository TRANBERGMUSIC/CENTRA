# A push that changes the native app (Rust, Tauri config, icons) builds and publishes a new CENTRA.
# Everything else is faster on its own:
#   interface (apps/app, packages)  web.yml    ~25 s, installed apps switch within a minute
#   sync server (relay)             relay.yml  ~30 s
# Run this one by hand to force a full build (tick "windows" for a Windows installer too).
# When GitHub has no free Mac and the Mac/iPhone jobs never start, retry.yml starts them again.
#
#   relay    Cloudflare Worker = the sync server (only when the CLOUDFLARE_API_TOKEN secret exists);
#            when it exists every app below is built with sync switched on
#   web      GitHub Pages: the installable phone/web app (only when Pages is switched on)
#   desktop  Mac (.dmg, Apple silicon) on the GitHub release; Windows only when asked for
#   ios      iPhone app to TestFlight (only when the Apple secrets exist, see docs/IPHONE.md)
#
# Auto-update: installed desktop apps read latest.json from the newest release; that file is signed
# with TAURI_SIGNING_PRIVATE_KEY. Without the secret the installers are still built, just without
# the update file — add the secret once and every later release updates itself.
name: Release
on:
  push:
    branches: [main]
    # Only changes to the native app (Rust, Tauri config, icons) need a full build. Interface-only
    # changes reach installed apps in about a minute through web.yml instead.
    paths:
      - 'apps/desktop/**'
      - 'scripts/ios-testflight.sh'
      - 'scripts/ios/**'
      - 'scripts/set-version.mjs'
      - 'scripts/updater-artifacts.mjs'
      - 'installer/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      windows:
        description: 'Byg også Windows-installeren'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# A new push replaces a build that is still waiting, so you always get the newest version.
concurrency: { group: release, cancel-in-progress: true }

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        run: |
          BASE=$(node -p "require('./apps/app/package.json').version.split('.').slice(0,2).join('.')")
          V="$BASE.${{ github.run_number }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - id: r
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          TAG=${{ steps.v.outputs.tag }}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "CENTRA ${TAG#v}" --notes "Automatisk build af ${{ github.sha }}. Installér: hent .dmg (Mac) eller .exe (Windows) herunder."
          echo "id=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq .id)" >> "$GITHUB_OUTPUT"

  relay:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      sync: ${{ steps.deploy.outputs.sync }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CENTRA_RELAY_URL: ${{ vars.CENTRA_RELAY_URL }}
        run: |
          # The server itself is deployed by relay.yml; here only its address (and a deploy if it doesn't answer).
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CENTRA_RELAY_URL" ]; then npm ci --no-audit --no-fund >/dev/null; fi
          URL=$(bash scripts/relay-url.sh --ensure)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then echo "sync=on" >> "$GITHUB_OUTPUT"; echo "Sync slået til: $URL"; else echo "sync=off" >> "$GITHUB_OUTPUT"; fi

  web:
    needs: [version, relay]
    # GitHub Pages (the web version in a browser): only when the repository variable CENTRA_PAGES is "on"
    if: vars.CENTRA_PAGES == 'on'
    runs-on: ubuntu-latest
    continue-on-error: true   # GitHub Pages must be switched on once (Settings → Pages → GitHub Actions)
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npm run build -w @centra/design-system && npx vitest run packages
      - name: Build
        env:
          CENTRA_BASE: /${{ github.event.repository.name }}/
          VITE_RELAY_URL: ${{ needs.relay.outputs.url }}
          VITE_SYNC: ${{ needs.relay.outputs.sync }}
        run: npm run build -w @centra/app
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: apps/app/dist }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  desktop:
    needs: [version, relay]
    strategy:
      fail-fast: false
      # The Mac app for Apple silicon (your Mac): half the compile time of a universal build. Only the
      # .app here; the .dmg is made with hdiutil below (Tauri's own DMG script drives Finder via
      # AppleScript, which often fails on headless CI machines). Windows only when run by hand with
      # "windows" ticked.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.windows && '[{"os":"macos-latest","args":"--target aarch64-apple-darwin --bundles app"},{"os":"windows-latest","args":""}]' || '[{"os":"macos-latest","args":"--target aarch64-apple-darwin --bundles app"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: 'apps/desktop/src-tauri -> target' }
      - run: npm ci
      - name: Version and update channel
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          # The built-in interface gets the same version number a fast update of this commit would.
          echo "WEB_VERSION=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          node scripts/set-version.mjs ${{ needs.version.outputs.version }}
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            node scripts/updater-artifacts.mjs off
            # Visible on the release page: this version cannot update installed apps.
            if [ "${{ runner.os }}" = "macOS" ]; then
              echo "Repository-secret TAURI_SIGNING_PRIVATE_KEY mangler, så denne udgivelse har ingen latest.json, og installerede apps kan ikke opdatere til den. Læg den ind under Settings -> Secrets and variables -> Actions -> Repository secrets." > MANGLER-OPDATERINGSNOEGLE.txt
              gh release upload ${{ needs.version.outputs.tag }} MANGLER-OPDATERINGSNOEGLE.txt --clobber
            fi
          fi
      # Apple signing is optional: only pass the variables when the secrets exist. Empty values make
      # Tauri try to sign with a certificate that isn't there, and the Mac build fails.
      - name: Apple signing (only when set up)
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!k}" ]; then echo "$k=${!k}" >> "$GITHUB_ENV"; fi
          done
          [ -n "$APPLE_CERTIFICATE" ] && echo "Apple-signering: til" || echo "Apple-signering: fra (ingen certifikat endnu)"

      - id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_RELAY_URL: ${{ needs.relay.outputs.url }}
          VITE_SYNC: ${{ needs.relay.outputs.sync }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          releaseId: ${{ needs.version.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}

      # Safety net: if the Tauri action stumbles on the Mac, build the app directly (the log goes on the release).
      - name: Mac app (fallback build)
        if: startsWith(matrix.os, 'macos') && steps.tauri.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_RELAY_URL: ${{ needs.relay.outputs.url }}
          VITE_SYNC: ${{ needs.relay.outputs.sync }}
        run: |
          set -o pipefail
          (cd apps/desktop && npx tauri build ${{ matrix.args }} -v) 2>&1 | tee mac-build-log.txt || {
            tail -c 200000 mac-build-log.txt > mac-build-fejl.txt
            gh release upload ${{ needs.version.outputs.tag }} mac-build-fejl.txt --clobber
            exit 1
          }

      - name: Mac installer (.dmg)
        if: startsWith(matrix.os, 'macos')
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          V=${{ needs.version.outputs.version }}
          APP=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/CENTRA.app
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Programmer
          hdiutil create -volname CENTRA -srcfolder dmg -ov -format UDZO "CENTRA_${V}_mac.dmg"
          gh release upload ${{ needs.version.outputs.tag }} "CENTRA_${V}_mac.dmg" --clobber
          gh release delete-asset ${{ needs.version.outputs.tag }} mac-build-fejl.txt -y 2>/dev/null || true

  # iPhone app via TestFlight. Switches itself on when the Apple secrets exist (see docs/IPHONE.md).
  ios-gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.gate.outputs.on }}
    steps:
      - id: gate
        env:
          P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$P8" ] && missing="$missing APPLE_API_KEY_P8"
          [ -z "$KEY_ID" ] && missing="$missing APPLE_API_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing APPLE_API_ISSUER"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          if [ -z "$missing" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "iPhone-bygget springes over. Mangler secrets:$missing"; fi

  ios:
    needs: [version, relay, ios-gate]
    if: needs.ios-gate.outputs.on == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: 'aarch64-apple-ios' }
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: 'apps/desktop/src-tauri -> target' }
      - run: npm ci
      - name: Build and upload to TestFlight
        env:
          VITE_RELAY_URL: ${{ needs.relay.outputs.url }}
          VITE_SYNC: ${{ needs.relay.outputs.sync }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          bash scripts/ios-testflight.sh ${{ needs.version.outputs.version }} ${{ github.run_number }} 2>&1 | tee ios-build-log.txt || {
            # The end of the log goes on the release, so the error can be read without GitHub's log viewer.
            tail -c 200000 ios-build-log.txt > iphone-build-fejl.txt
            gh release upload ${{ needs.version.outputs.tag }} iphone-build-fejl.txt --clobber
            exit 1
          }
          gh release delete-asset ${{ needs.version.outputs.tag }} iphone-build-fejl.txt -y 2>/dev/null || true
