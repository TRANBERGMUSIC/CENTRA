# Every push to main builds and publishes a new CENTRA. Nothing to run by hand.
#
#   relay    Cloudflare Worker (only when the CLOUDFLARE_API_TOKEN secret exists)
#   web      GitHub Pages: the installable phone/web app (only when Pages is switched on)
#   desktop  Mac (.dmg, universal) and Windows (.exe/.msi) on the GitHub release
#
# Auto-update: installed desktop apps read latest.json from the newest release; that file is signed
# with TAURI_SIGNING_PRIVATE_KEY. Without the secret the installers are still built, just without
# the update file — add the secret once and every later release updates itself.
name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'prototypes/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: { group: release, cancel-in-progress: false }

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release_id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          BASE=$(node -p "require('./apps/app/package.json').version.split('.').slice(0,2).join('.')")
          V="$BASE.${{ github.run_number }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - id: r
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          TAG=${{ steps.v.outputs.tag }}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "CENTRA ${TAG#v}" --notes "Automatisk build af ${{ github.sha }}. Installér: hent .dmg (Mac) eller .exe (Windows) herunder."
          echo "id=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq .id)" >> "$GITHUB_OUTPUT"

  relay:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Ingen CLOUDFLARE_API_TOKEN: springer serveren over (appen bruger CENTRA_RELAY_URL eller kører lokalt)."
            echo "url=${{ vars.CENTRA_RELAY_URL }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npm ci
          npx vitest run packages/relay-core
          cd services/relay-cf
          OUT=$(npx wrangler deploy 2>&1 | tee /dev/stderr)
          URL=$(echo "$OUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)
          echo "url=${URL/https:/wss:}" >> "$GITHUB_OUTPUT"

  web:
    needs: [version, relay]
    runs-on: ubuntu-latest
    continue-on-error: true   # GitHub Pages must be switched on once (Settings → Pages → GitHub Actions)
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/set-version.mjs ${{ needs.version.outputs.version }}
      - run: npm run build -w @centra/design-system && npx vitest run packages
      - name: Build
        env:
          CENTRA_BASE: /${{ github.event.repository.name }}/
          VITE_RELAY_URL: ${{ needs.relay.outputs.url }}
        run: npm run build -w @centra/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/app/dist }
      - id: deploy
        uses: actions/deploy-pages@v4

  desktop:
    needs: [version, relay]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'apps/desktop/src-tauri -> target' }
      - run: npm ci
      - name: Version and update channel
        shell: bash
        run: |
          node scripts/set-version.mjs ${{ needs.version.outputs.version }}
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then node scripts/updater-artifacts.mjs off; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_RELAY_URL: ${{ needs.relay.outputs.url }}
          # Optional, for no Gatekeeper warning on Mac: an Apple Developer ID certificate.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          releaseId: ${{ needs.version.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}

  # iPhone app via TestFlight. Switches itself on when the Apple secrets exist (see docs/IPHONE.md).
  ios:
    needs: [version, relay]
    runs-on: macos-latest
    steps:
      - id: gate
        env: { KEY: '${{ secrets.APP_STORE_CONNECT_API_KEY }}' }
        run: if [ -n "$KEY" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "Ingen Apple-nøgler endnu – iPhone-bygget springes over."; fi
      - if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.on == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.gate.outputs.on == 'true'
        env:
          VITE_RELAY_URL: ${{ needs.relay.outputs.url }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/ios-testflight.sh ${{ needs.version.outputs.version }} ${{ github.run_number }}
